name: git-deb image

on:
  push:
    branches:
      - main
    paths:
      - "git-deb/**"
      - ".github/workflows/git-deb-image.yml"
  workflow_dispatch:

concurrency:
  group: git-deb-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/git-deb
  GIT_VERSION: "2.56.0"

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the arch image
        uses: docker/build-push-action@v6
        with:
          context: git-deb
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.GIT_VERSION }}-${{ matrix.arch }}
          build-args: |
            GIT_VERSION=${{ env.GIT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the git deb installs standalone and passes the version gate
        run: |
          docker build -t git-deb-verify -f - . <<EOF
          FROM ubuntu:24.04
          COPY --from=$IMAGE:$GIT_VERSION-${{ matrix.arch }} /debs/git_*.deb /tmp/
          RUN apt-get update \
              && apt-get install -y --no-install-recommends /tmp/git_*.deb \
              && git --version | tee /dev/stderr | grep -qx "git version $GIT_VERSION" \
              && rm -rf /var/lib/apt/lists/* /tmp/git_*.deb
          EOF

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the arch images into a multi-arch tag
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$GIT_VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE:$GIT_VERSION-amd64" \
            "$IMAGE:$GIT_VERSION-arm64"